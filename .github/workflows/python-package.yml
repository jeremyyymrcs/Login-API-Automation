name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  repository_dispatch:
    types: [ trigger-workflow ]  # This should match the `event-type` in Repo B's workflow


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Chrome
        run: |
          sudo apt install google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Install chromedriver
        run: |
          seleniumbase install chromedriver

      - name: Test with Login Feature
        run: |
          cd tests
          pytest test_login.py -s -q -x --dashboard --html=report.html --save-screenshot --maximize 2>&1 | tee result.log   
          pytest_exit_code=${PIPESTATUS[0]}  # Capture the exit code of pytest

      - name: Send logs to Slack
        if: success() || failure()
        run: |
          # Get the logs and properly escape special characters
          log_contents=$(cat tests/result.log | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          # Extract the last 20 characters from the log contents
          last_20_chars="${log_contents: -20}"
      
          # Check if "passed" or "failed" is present in the last 20 characters
          if [[ "$last_20_chars" == *"failed"* ]]; then
            result_summary="*Test Results Summary:* Failed ❌"
          elif [[ "$last_20_chars" == *"passed"* ]]; then
            result_summary="*Test Results Summary:* Passed ✅"
          else
            result_summary="*Test Results Summary:* Unknown Status"
          fi
          
          # Get the link to download the GitHub artifacts
          artifact_url="https://github.com/jeremyyymrcs/Login-API-Automation/actions/runs/${{ github.run_id }}"
          
          # Send the logs, result summary, and artifact link to Slack with enhanced formatting
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"*Test Logs:*\\n$log_contents\\n---\\n\\n$result_summary\\n---\\n*To download the detailed report, visit*: <$artifact_url|GitHub Artifacts>\\n\\n---\\n*Test Run Completed* ✔️\\n‎ \"}" \
          ${{ secrets.SLACK_CHANNEL_REPORT_HOOK }}

      - name: Test with API Automation
        run: |
          cd /home/runner/work/Login-API-Automation/Login-API-Automation
          pytest api_testing.py -s -v

      - name: Upload logs and screenshots from Github Action artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-result(please extract the file before viewing)
          path: |
            tests/report.html
            tests/assets/**
        if: always()  # This ensures the step runs regardless of previous success or failure


      - name: Download artifact and create a zip
        uses: actions/download-artifact@v4
        with:
          name: test-result(please extract the file before viewing)
          path: ./artifact_files

      - name: Create ZIP of report and assets
        run: |
          zip -r test-results.zip tests/report.html tests/assets/







