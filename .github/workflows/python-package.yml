name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  repository_dispatch:
    types: [ trigger-workflow ]  # This should match the `event-type` in Repo B's workflow


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Chrome
        run: |
          sudo apt install google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Install chromedriver
        run: |
          seleniumbase install chromedriver

      - name: Test with Login Feature
        run: |
          cd tests
          pytest test_login.py -s -q -x --dashboard --html=report.html --save-screenshot --maximize

      - name: Test with API Automation
        run: |
          cd /home/runner/work/Login-API-Automation/Login-API-Automation
          pytest api_testing.py -s -v

      - name: Upload logs and screenshots from Github Action artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-result(please extract the file before viewing)
          path: |
            tests/report.html
            tests/assets/**


      - name: Download artifact and create a zip
        uses: actions/download-artifact@v4
        with:
          name: test-result(please extract the file before viewing)
          path: ./artifact_files

      - name: Zip the artifact files
        run: |
          zip -r artifact_files.zip ./artifact_files

      - name: Upload the zip file as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-files-zip
          path: artifact_files.zip

      - name: Send results to Slack
        if: success() || failure()  # Send notification regardless of success/failure
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "Test results are available! :tada:\n\nHere is the [test report](https://github.com/jeremyyymrcs/Login-API-Automation/actions/runs/${{ github.run_id }})\n\nThe tests have completed. Check the results and logs.\n\nYou can also download the artifact from [this link](https://github.com/jeremyyymrcs/Login-API-Automation/actions/runs/${{ github.run_id }}/artifacts).\n\nAlso, here is the [zip file](https://github.com/jeremyyymrcs/Login-API-Automation/actions/runs/${{ github.run_id }}/artifacts/$(echo ${{ github.run_id }}).zip)."
            }' \
            ${{ secrets.SLACK_CHANNEL_REPORT_HOOK }}


